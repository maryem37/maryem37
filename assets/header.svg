<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A3D91"/>
      <stop offset="50%" stop-color="#0A66FF"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="260" fill="url(#bg)"/>
  <circle cx="1050" cy="60" r="90" fill="#ffffff" opacity="0.08">
    <animate attributeName="r" values="80;100;80" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="40" r="50" fill="#ffffff" opacity="0.06">
    <animate attributeName="cy" values="40;70;40" dur="7s" repeatCount="indefinite"/>
  </circle>
  <g>
    <path d="M0,205 Q150,165 300,205 T600,205 T900,205 T1200,205 T1500,205 T1800,205 T2100,205 T2400,205 V260 H0 Z" fill="#ffffff" opacity="0.18">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1200 0" dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M0,220 Q150,190 300,220 T600,220 T900,220 T1200,220 T1500,220 T1800,220 T2100,220 T2400,220 V260 H0 Z" fill="#ffffff" opacity="0.28">
      <animateTransform attributeName="transform" type="translate" from="-1200 0" to="0 0" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>
  <text x="600" y="115" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#ffffff" opacity="0">
    Mariem Kbaier
    <animate attributeName="opacity" from="0" to="1" dur="1.5s" fill="freeze"/>
  </text>
  <text x="600" y="160" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#E6F6FF" opacity="0">
    AI &amp; MLOps Engineering Student @ ENIS
    <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="1.5s" fill="freeze"/>
  </text>
</svg>
