nt-weight="700" fill="#0A66FF">+</text><text x="90" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#27457A">Built AgriMent, a multi-agent decision-support platform (9 microservices) with dynamic routing and a supervisor. 2nd of 10 teams (120+</text><text x="90" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#27457A">participants).</text><text x="70" y="194" font-family="ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace" font-size="13" font-weight="700" fill="#0A66FF">+</text><text x="90" y="194" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#27457A">Hybrid RAG on French regulation sources (Mistral embeddings + BM25 + RRF): 0.626 faithfulness (+14% vs. no RAG), 0.941 context precision.</text><text x="70" y="218" font-family="ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace" font-size="13" font-weight="700" fill="#0A66FF">+</text><text x="90" y="218" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#27457A">Fine-tuned a TempCNN crop classifier on Sentinel-2 imagery (80.3% accuracy); graded-confidence design aligned with EU AI Act transparency.</text><rect x="70" y="238" width="82" height="26" rx="13" fill="#fff" stroke="#1E90FF" stroke-opacity=".7"/><text x="111" y="255" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0B3C91">LangGraph</text><rect x="160" y="238" width="69" height="26" rx="13" fill="#fff" stroke="#1E90FF" stroke-opacity=".7"/><text x="195" y="255" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0B3C91">FastAPI</text><rect x="238" y="238" width="69" height="26" rx="13" fill="#fff" stroke="#1E90FF" stroke-opacity=".7"/><text x="272" y="255" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0B3C91">Mistral</text><rect x="315" y="238" width="62" height="26" rx="13" fill="#fff" stroke="#1E90FF" stroke-opacity=".7"/><text x="346" y="255" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0B3C91">Qdrant</text><rect x="385" y="238" width="69" height="26" rx="13" fill="#fff" stroke="#1E90FF" stroke-opacity=".7"/><text x="419" y="255" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0B3C91">PyTorch</text><rect x="462" y="238" width="69" height="26" rx="13" fill="#fff" stroke="#1E90FF" stroke-opacity=".7"/><text x="496" y="255" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0B3C91">PostGIS</text><rect x="539" y="238" width="56" height="26" rx="13" fill="#fff" stroke="#1E90FF" stroke-opacity=".7"/><text x="567" y="255" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0B3C91">React</text><rect x="603" y="238" width="62" height="26" rx="13" fill="#fff" stroke="#1E90FF" stroke-opacity=".7"/><text x="634" y="255" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0B3C91">Docker</text><circle cx="40" cy="306" r="8" fill="#fff" stroke="#0A66FF" stroke-width="3"/><text x="68" y="311" font-family="ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace" font-size="16" font-weight="700" fill="#0A66FF">b52d0f1</text><text x="149" y="312" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#0B3C91">BNS Engineering: Full-stack Developer Intern</text><text x="1170" y="311" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace" font-size="14" fill="#6B86B8">Jun - Aug 2025</text><text x="70" y="344" font-family="ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace" font-size="13" font-weight="700" fill="#0A66FF">+</text><text x="90" y="344" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#27457A">Self-service service-catalog module, delivered in an Agile/Scrum team.</text><text x="70" y="368" font-family="ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace" font-size="13" font-weight="700" fill="#0A66FF">+</text><text x="90" y="368" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#27457A">Secured Spring Boot REST API (~15 endpoints) in a microservices architecture, with React.js frontend, MySQL and Docker deployment.</text><text x="70" y="392" font-family="ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace" font-size="13" font-weight="700" fill="#0A66FF">+</text><text x="90" y="392" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#27457A">Semantic chatbot for natural-language search in the catalog and user assistance.</text><rect x="70" y="412" width="96" height="26" rx="13" fill="#fff" stroke="#1E90FF" stroke-opacity=".7"/><text x="118" y="429" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0B3C91">Spring Boot</text><rect x="174" y="412" width="76" height="26" rx="13" fill="#fff" stroke="#1E90FF" stroke-opacity=".7"/><text x="212" y="429" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0B3C91">React.js</text><rect x="258" y="412" width="56" height="26" rx="13" fill="#fff" stroke="#1E90FF" stroke-opacity=".7"/><text x="285" y="429" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0B3C91">MySQL</text><rect x="321" y="412" width="62" height="26" rx="13" fill="#fff" stroke="#1E90FF" stroke-opacity=".7"/><text x="352" y="429" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" 